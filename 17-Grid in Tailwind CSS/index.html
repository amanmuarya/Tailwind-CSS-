<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./output.css">
    <title>Grid in Tailwind CSS</title>
</head>
<body>
<!-- first wright grid than wright any grid to work eassly 
 grid grid-cols-2 , col-span-2  do columnes ke  size  karne ke liye , col-span-2  same 
  this is media quari -  md:grid-cols-6 , sm:grid-cols-4
-->
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-4 md:grid-cols-6">

    <div class="bg-pink-500 p-12 border border-pink-800">0</div>
    <div class="bg-pink-500 p-12 border border-pink-800 row-span-2 ">1</div>
    <div class="bg-pink-500 p-12 border border-pink-800">2</div>
    <div class="bg-pink-500 p-12 border border-pink-800">3</div>
    <div class="bg-pink-500 p-12 border border-pink-800">4</div>
    <div class="bg-pink-500 p-12 border border-pink-800">5</div>
    <div class="bg-pink-500 p-12 border border-pink-800">6</div>
    <div class="bg-pink-500 p-12 border border-pink-800 col-span-2">7</div>
    <div class="bg-pink-500 p-12 border border-pink-800">8</div>
    <div class="bg-pink-500 p-12 border border-pink-800">9</div>
    <div class="bg-pink-500 p-12 border border-pink-800">10</div>
    <div class="bg-pink-500 p-12 border border-pink-700">11</div>
    <div class="bg-pink-500 p-12 border border-pink-700">12</div>
    <div class="bg-pink-500 p-12 border border-pink-700">13</div>
    <div class="bg-pink-500 p-12 border border-pink-700">14</div>
    <div class="bg-pink-500 p-12 border border-pink-700">15</div>
  </div>
</body>
</html>

<h1>Hue:</h1>
<!-- hue-rotate() image या element के colors (hue) को rotate करता है। इससे image 
का रंग बदल जाता है, लेकिन brightness और contrast लगभग वही रहते हैं। -->

<img class="h-55 w-65 hue-rotate-15 " src="hello.jpg" alt="img"> 
<img class="h-55 w-65 hue-rotate-30 " src="hello.jpg" alt="img"> 
<img class="h-55 w-65 hue-rotate-45 " src="hello.jpg" alt="img">

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./output.css">
    <title>Document</title>
</head>
<body>
    <!-- animation here -- animate-bounce , rounded-full , 
     ml = margin left 
     mt = margin top 
     
    -->
    <div class="size-35 bg-green-400 p-6 ml-10 mt-10
    animate-bounce rounded-full"></div>
    <hr>

    <div class=" bg-amber-400 size-25 mt-12 ml-12
    animate-spin"></div>
    <hr>
  
    <div class=" bg-pink-400 h-2 w-22 mt-12 ml-12
        animate-spin"></div>
        <hr>
        <div class="bg-blue-600 animate-ping m-22 size-25 
        rounded-full"></div>

        <hr>
        <div class="bg-red-500 animate-pulse m-22 size-25 
                rounded-full"></div>
</body>
</html>
